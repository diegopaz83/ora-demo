<body>
<title>Operational Risk Assessment</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: Kairos Ecosistema shell — landing partida (marca navy | acceso) y app con barra lateral navy 248px,
   cabecera con progreso global y captura rapida; wizard con stepper + carril "Que tengo / Que me falta". */
:root {
  --font: 'Poppins', 'Segoe UI', system-ui, sans-serif;
  --navy: #001c3f; --navy-2: #00285a; --blue: #002473; --bright: #0a58eb; --cyan: #00dcfa; --violet: #7543ff;
  --bg: #f2f5f9; --surface: #fff; --surface-2: #f6f8fb; --ink: #001c3f; --muted: #556578; --line: #dbe2ea; --line-2: #eef2f6;
  --primary: #002473; --primary-ink: #fff; --primary-soft: #e8eefc; --focus: #0a58eb;
  --ok-bg: #e5f7ee; --ok-ink: #145a37; --warn-bg: #fff4e0; --warn-ink: #7a4a00; --err-bg: #fbeaeb; --err-ink: #b0353c;
  --approval: #4a5f80; --approval-soft: #edf1f6; --off-bg: #e9edf2; --off-ink: #6b7a8d;
  --side-ink: #c9d6e6; --side-muted: #7d93ae; --side-active: rgba(0,220,250,.12);
  --shadow: 0 12px 32px rgba(0,28,63,.18); --shadow-sm: 0 2px 8px rgba(0,28,63,.08);
  --r-ctl: 8px; --r-surf: 12px;
  --lv-high: #c2353d; --lv-high-bg: #fbeaeb; --lv-med: #c77700; --lv-med-bg: #fff4e0; --lv-low: #1d7a4a; --lv-low-bg: #e5f7ee; --lv-pend: #6b7a8d; --lv-pend-bg: #eef1f5;
  --chart-1: #0a58eb; --chart-2: #00b8d9; --chart-3: #7543ff; --grid: #e3e9f0;
  --side-w: 248px; --side-w-min: 64px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #07111f; --surface: #0d1b2f; --surface-2: #112339; --ink: #e7eef7; --muted: #9db0c5; --line: #22385a; --line-2: #182b45;
  --primary: #5d8dff; --primary-ink: #04122a; --primary-soft: #16294a; --focus: #7fb0ff; --bright: #7fb0ff;
  --ok-bg: #0e3324; --ok-ink: #8fe3b6; --warn-bg: #3a2a0c; --warn-ink: #ffd28a; --err-bg: #3d1519; --err-ink: #ff7a80;
  --approval: #a9b9d1; --approval-soft: #18263a; --off-bg: #132439; --off-ink: #8597ad;
  --navy: #020c1a; --navy-2: #061a33; --shadow: 0 12px 32px rgba(0,0,0,.55); --shadow-sm: 0 2px 8px rgba(0,0,0,.4);
  --lv-high: #ff7a80; --lv-high-bg: #3d1519; --lv-med: #ffc061; --lv-med-bg: #3a2a0c; --lv-low: #7fdcaa; --lv-low-bg: #0e3324; --lv-pend: #9db0c5; --lv-pend-bg: #172a43;
  --chart-1: #5d8dff; --chart-2: #00cfee; --chart-3: #a98bff; --grid: #1d3253;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #07111f; --surface: #0d1b2f; --surface-2: #112339; --ink: #e7eef7; --muted: #9db0c5; --line: #22385a; --line-2: #182b45;
  --primary: #5d8dff; --primary-ink: #04122a; --primary-soft: #16294a; --focus: #7fb0ff; --bright: #7fb0ff;
  --ok-bg: #0e3324; --ok-ink: #8fe3b6; --warn-bg: #3a2a0c; --warn-ink: #ffd28a; --err-bg: #3d1519; --err-ink: #ff7a80;
  --approval: #a9b9d1; --approval-soft: #18263a; --off-bg: #132439; --off-ink: #8597ad;
  --navy: #020c1a; --navy-2: #061a33; --shadow: 0 12px 32px rgba(0,0,0,.55); --shadow-sm: 0 2px 8px rgba(0,0,0,.4);
  --lv-high: #ff7a80; --lv-high-bg: #3d1519; --lv-med: #ffc061; --lv-med-bg: #3a2a0c; --lv-low: #7fdcaa; --lv-low-bg: #0e3324; --lv-pend: #9db0c5; --lv-pend-bg: #172a43;
  --chart-1: #5d8dff; --chart-2: #00cfee; --chart-3: #a98bff; --grid: #1d3253;
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body, #app { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5; font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: var(--bright); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.sm { width: 15px; height: 15px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wm { font-weight: 300; letter-spacing: -.01em; }
.wm b { font-weight: 600; color: var(--cyan); }
.mut { color: var(--muted); }
.small { font-size: 12.5px; }

/* ---------- Landing ---------- */
.landing { min-height: 100%; display: grid; grid-template-columns: 1.15fr 1fr; }
.brand { position: relative; overflow: hidden; background: var(--navy); color: #f2f7fc; display: flex; flex-direction: column; justify-content: space-between; gap: 40px;
  padding-block: 48px; padding-left: max(48px, env(safe-area-inset-left, 0px)); padding-right: 48px; min-height: 600px; }
.brand-photo { position: absolute; inset: 0; background: #001c3f url(assets/hero.jpg) center / cover no-repeat; opacity: .5; }
.brand::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,28,63,.6) 0%, rgba(0,28,63,.25) 45%, rgba(0,28,63,.94) 100%); }
.brand > *:not(.brand-photo) { position: relative; z-index: 2; }
.brand-logo { height: 38px; width: auto; align-self: flex-start; }
.brand-copy { display: flex; flex-direction: column; gap: 20px; max-width: 560px; }
.brand-copy .eyebrow { color: #b7c6da; font-size: 14px; }
.brand-copy .wm { font-size: 20px; color: #fff; }
.brand-copy h1 { font-size: clamp(38px, 5vw, 68px); font-weight: 300; line-height: 1.04; letter-spacing: -.025em; }
.brand-copy h1 b { font-weight: 600; }
.brand-copy p { font-size: 16.5px; line-height: 1.65; color: #c3d0e1; max-width: 48ch; }
.brand-chain { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: #c3d0e1; }
.brand-chain span { padding: 6px 12px; border: 1px solid rgba(183,198,218,.3); border-radius: 999px; }
.brand-chain i { width: 14px; height: 1px; background: rgba(0,220,250,.6); }
.brand-foot { font-size: 12px; color: #8ea3bd; }
.access { display: flex; align-items: center; justify-content: center; padding-block: 48px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.access-card { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 22px; }
.access-head { display: flex; flex-direction: column; gap: 8px; }
.access-head h2 { font-size: 28px; font-weight: 600; letter-spacing: -.01em; }
.access-head p { color: var(--muted); }
.demo-chip { align-self: flex-start; display: inline-flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 500; color: var(--warn-ink); background: var(--warn-bg); padding: 4px 10px; border-radius: 999px; }
.choice { display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: center; width: 100%; text-align: left; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r-surf); background: var(--surface); transition: border-color .15s, box-shadow .15s, transform .15s; }
.choice:hover { border-color: var(--bright); box-shadow: var(--shadow-sm); transform: translateY(-1px); }
.choice .c-ic { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: var(--primary-soft); color: var(--primary); }
.choice .c-ic.nv { background: var(--navy); color: var(--cyan); }
.choice b { display: block; font-weight: 600; font-size: 14.5px; }
.choice span.d { font-size: 12.5px; color: var(--muted); }
.access-foot { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }

/* ---------- Shell ---------- */
.shell { height: 100%; display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); }
.side { background: var(--navy); color: var(--side-ink); display: flex; flex-direction: column; gap: 22px; padding: 24px 14px; overflow-y: auto; min-width: 0; }
.side-logo { display: flex; align-items: center; gap: 10px; padding: 0 10px; }
.side-logo img { height: 24px; width: auto; }
.side-logo .wm { font-size: 14px; color: #fff; border-left: 1px solid rgba(201,214,230,.2); padding-left: 10px; line-height: 1.15; }
.side-case { margin: 0 4px; padding: 12px; border-radius: 10px; background: rgba(255,255,255,.04); border: 1px solid rgba(201,214,230,.1); display: flex; flex-direction: column; gap: 6px; }
.side-case small { font-size: 11px; color: var(--side-muted); letter-spacing: .06em; text-transform: uppercase; }
.side-case b { color: #fff; font-weight: 500; font-size: 13px; line-height: 1.3; }
.side-case .sbar { height: 5px; border-radius: 999px; background: rgba(255,255,255,.1); overflow: hidden; }
.side-case .sbar i { display: block; height: 100%; background: var(--cyan); border-radius: 999px; }
.side-case span { font-size: 11.5px; color: var(--side-ink); }
.nav { display: flex; flex-direction: column; gap: 3px; }
.nav-label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--side-muted); padding: 12px 12px 6px; }
.nav button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border-radius: var(--r-ctl); color: var(--side-ink); font-size: 14px; text-align: left; position: relative; }
.nav button:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav button[aria-current="page"] { background: var(--side-active); color: #fff; font-weight: 500; }
.nav button[aria-current="page"]::before { content: ""; position: absolute; left: -14px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--cyan); }
.nav .nb { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: #ffb547; color: #2b1a00; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 2px; border-top: 1px solid rgba(201,214,230,.12); padding-top: 12px; }
.side-foot button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 12px; border-radius: var(--r-ctl); color: var(--side-ink); font-size: 13px; text-align: left; }
.side-foot button:hover { background: rgba(255,255,255,.06); color: #fff; }
.side-ver { font-size: 11px; color: var(--side-muted); padding: 6px 12px 0; }

.work { display: flex; flex-direction: column; min-width: 0; height: 100%; overflow: hidden; }
.top { display: flex; align-items: center; gap: 14px; padding-block: 10px; padding-left: 24px; padding-right: 24px; background: var(--surface); border-bottom: 1px solid var(--line); min-height: 64px; }
.menu-btn { display: none; width: 40px; height: 40px; border-radius: var(--r-ctl); align-items: center; justify-content: center; }
.crumb { display: flex; flex-direction: column; min-width: 0; }
.crumb small { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumb strong { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
.saved { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.saved i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok-ink); }
.ring { position: relative; width: 46px; height: 46px; flex: none; }
.ring svg { width: 46px; height: 46px; transform: rotate(-90deg); overflow: visible; }
.ring .rt { fill: none; stroke: var(--line-2); stroke-width: 4; }
.ring .rp { fill: none; stroke: url(#ring-g); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: calc(100 - var(--p)); transition: stroke-dashoffset .8s cubic-bezier(.3,.7,.2,1); }
.ring.anim .rp { animation: ringfill 1s cubic-bezier(.3,.7,.2,1); }
@keyframes ringfill { from { stroke-dashoffset: 100; } }
.ring.full .rp { stroke: var(--ok-ink); }
.ring.full { background: var(--ok-bg); border-radius: 50%; }
.ring span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; line-height: 1; color: var(--ink); letter-spacing: -.02em; }
.ring span i { font-style: normal; display: inline-flex; align-items: baseline; }
.ring span b { font-size: 12.5px; font-weight: 700; }
.ring span small { font-size: 7.5px; font-weight: 600; margin-left: 1px; color: var(--muted); }
.ring.full span b { font-size: 11px; color: var(--ok-ink); }
@media (prefers-reduced-motion: reduce) { .ring .rp { transition: none; animation: none; } }
.icon-btn { width: 40px; height: 40px; border-radius: var(--r-ctl); display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.main { flex: 1; min-width: 0; overflow-y: auto; padding-block: 24px 96px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.main-in { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

/* ---------- Common ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 16px; border-radius: var(--r-ctl); font-size: 13.5px; font-weight: 500; white-space: nowrap; min-height: 40px; }
.btn.primary { background: var(--primary); color: var(--primary-ink); }
.btn.primary:hover { filter: brightness(1.1); }
.btn.ghost { border: 1px solid var(--line); color: var(--ink); background: var(--surface); }
.btn.ghost:hover { border-color: var(--bright); }
.btn.soft { background: var(--primary-soft); color: var(--primary); }
.btn.danger { background: var(--err-bg); color: var(--err-ink); }
.btn.sm { padding: 6px 12px; min-height: 34px; font-size: 12.5px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.hello { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.hello h1 { font-size: 26px; font-weight: 600; letter-spacing: -.01em; }
.hello p { color: var(--muted); max-width: 70ch; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-surf); min-width: 0; }
.box-head { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line-2); }
.box-head h2, .box-head h3 { font-size: 15.5px; font-weight: 600; }
.box-head p { font-size: 12.5px; color: var(--muted); width: 100%; margin-top: -4px; }
.box-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.sec-title { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .07em; text-transform: uppercase; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 500; padding: 2px 10px; border-radius: 999px; background: var(--off-bg); color: var(--off-ink); white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok-ink); }
.pill.warn { background: var(--warn-bg); color: var(--warn-ink); }
.pill.err { background: var(--err-bg); color: var(--err-ink); }
.pill.pri { background: var(--primary-soft); color: var(--primary); }
.pill.vio { background: var(--approval-soft); color: var(--approval); }
.pill.demo { background: var(--warn-bg); color: var(--warn-ink); border: 1px dashed var(--warn-ink); }
.lv { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; padding: 2px 10px 2px 8px; border-radius: 999px; white-space: nowrap; }
.lv::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: currentColor; }
.lv.alto { background: var(--lv-high-bg); color: var(--lv-high); }
.lv.medio { background: var(--lv-med-bg); color: var(--lv-med); }
.lv.bajo { background: var(--lv-low-bg); color: var(--lv-low); }
.lv.pend { background: var(--lv-pend-bg); color: var(--lv-pend); }
.lv.pend::before { background: repeating-linear-gradient(45deg, currentColor 0 2px, transparent 2px 4px); }
.scroll-x { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 9px 14px; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 14px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid2.g-13 { grid-template-columns: minmax(0,1.3fr) minmax(0,1fr); }
.grid2.g-12 { grid-template-columns: minmax(0,1fr) minmax(0,2fr); }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .field .lbl { font-size: 12.5px; font-weight: 500; color: var(--muted); }
.field input:not([type=checkbox]):not([type=radio]), .field select, .field textarea, .inp { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-ctl); padding: 9px 12px; min-height: 40px; }
.field textarea { min-height: 72px; resize: vertical; }
.field input:not([type=checkbox]):not([type=radio]):focus, .field select:focus, .field textarea:focus, .inp:focus { outline: 2px solid var(--focus); outline-offset: 0; border-color: transparent; }
.field .req { color: var(--err-ink); }
.field.miss input, .field.miss select, .field.miss textarea { border-color: var(--warn-ink); background: var(--warn-bg); }
.hint { font-size: 12px; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.end { justify-content: flex-end; }
.spacer { flex: 1; }
.flash { animation: flash 1.6s ease-out 1; }
@keyframes flash { 0%, 30% { box-shadow: 0 0 0 3px var(--cyan); } 100% { box-shadow: 0 0 0 3px transparent; } }
.note-demo { display: flex; gap: 10px; align-items: flex-start; font-size: 12.5px; padding: 10px 14px; border-radius: var(--r-ctl); background: var(--warn-bg); color: var(--warn-ink); }
.note-info { display: flex; gap: 10px; align-items: flex-start; font-size: 12.5px; padding: 10px 14px; border-radius: var(--r-ctl); background: var(--primary-soft); color: var(--primary); }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 36px 20px; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r-surf); }
.empty b { color: var(--ink); font-weight: 600; }

/* ---------- Inicio ---------- */
.as-list { display: flex; flex-direction: column; }
.as-row { display: grid; grid-template-columns: 52px minmax(0,1fr) 180px auto; gap: 16px; align-items: center; padding: 16px 18px; border-top: 1px solid var(--line-2); }
.as-row:first-child { border-top: 0; }
.as-ic { width: 52px; height: 52px; border-radius: 12px; background: var(--primary-soft); display: flex; align-items: center; justify-content: center; }
.as-ic img { width: 34px; height: 34px; object-fit: contain; }
:root[data-theme="dark"] .as-ic img { filter: invert(1) hue-rotate(180deg) brightness(1.3); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .as-ic img { filter: invert(1) hue-rotate(180deg) brightness(1.3); } }
.as-row b { font-weight: 600; font-size: 15px; }
.pbar { height: 7px; border-radius: 999px; background: var(--line-2); overflow: hidden; }
.pbar i { display: block; height: 100%; border-radius: 999px; background: var(--bright); }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-surf); padding: 16px; display: flex; flex-direction: column; gap: 4px; text-align: left; min-width: 0; }
button.kpi:hover { border-color: var(--bright); box-shadow: var(--shadow-sm); }
.kpi small { font-size: 12px; color: var(--muted); font-weight: 500; }
.kpi .v { font-size: 28px; font-weight: 600; line-height: 1.1; letter-spacing: -.01em; }
.kpi .v em { font-style: normal; font-size: 15px; font-weight: 400; color: var(--muted); }
.kpi .d { font-size: 11.5px; color: var(--muted); }
.mods { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
.mod { padding: 16px; border: 1px solid var(--line); border-radius: var(--r-surf); background: var(--surface); display: flex; flex-direction: column; gap: 6px; }
.mod b { font-weight: 600; }
.mod .t { font-size: 12px; color: var(--bright); font-weight: 500; }

/* ---------- Wizard ---------- */
.stepper { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 8px; }
.step { display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 10px 12px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); position: relative; min-width: 0; }
.step:hover { border-color: var(--bright); }
.step[aria-current="step"] { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.step .n { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); font-weight: 500; }
.step .n i { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-style: normal; font-size: 11.5px; font-weight: 600; background: var(--off-bg); color: var(--off-ink); flex: none; }
.step.s-complete .n i { background: var(--ok-ink); color: var(--surface); }
.step.s-progress .n i, .step.s-evidence .n i { background: var(--bright); color: #fff; }
.step.s-review .n i { background: var(--approval); color: #fff; }
.step.s-blocked .n i { background: var(--err-ink); color: #fff; }
.step b { font-size: 13px; font-weight: 600; line-height: 1.25; }
.step .st { font-size: 11px; font-weight: 500; }
.step .pbar { height: 4px; }
.s-complete .st { color: var(--ok-ink); } .s-progress .st { color: var(--bright); } .s-evidence .st { color: var(--warn-ink); } .s-review .st { color: var(--approval); } .s-blocked .st { color: var(--err-ink); } .s-none .st { color: var(--off-ink); }
.wiz { display: grid; grid-template-columns: minmax(0,1fr) 340px; gap: 20px; align-items: start; }
.wiz > * { min-width: 0; }
.rail { position: sticky; top: 0; display: flex; flex-direction: column; gap: 14px; }
.have { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px 14px; padding: 14px 16px; }
.have div { display: flex; flex-direction: column; }
.have b { font-size: 20px; font-weight: 600; line-height: 1.15; }
.have span { font-size: 11.5px; color: var(--muted); }
.pend-list { display: flex; flex-direction: column; max-height: 460px; overflow-y: auto; }
.pend { display: grid; grid-template-columns: 8px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line-2); text-align: left; width: 100%; }
.pend:hover { background: var(--surface-2); }
.pend .sv { width: 8px; height: 30px; border-radius: 3px; }
.pend .sv.block { background: var(--err-ink); } .pend .sv.imp { background: var(--warn-ink); } .pend .sv.sug { background: var(--bright); } .pend .sv.rev { background: var(--approval); }
.pend b { display: block; font-size: 12.5px; font-weight: 600; line-height: 1.3; }
.pend span { display: block; font-size: 11.5px; color: var(--muted); line-height: 1.35; }
.pend .go { color: var(--bright); font-size: 12px; font-weight: 500; white-space: nowrap; }
.pend-filters { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 14px 0; }
.chip { font-size: 12px; font-weight: 500; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.stage-head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-start; justify-content: space-between; }
.stage-head h2 { font-size: 21px; font-weight: 600; }
.stage-head p { color: var(--muted); max-width: 66ch; margin-top: 4px; }
.crit { display: flex; flex-wrap: wrap; gap: 8px; }
.crit span { font-size: 12px; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
.crit span b { font-weight: 600; }
.stage-nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding-top: 4px; }

/* processes */
.proc { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px 16px; padding: 14px 18px; border-top: 1px solid var(--line-2); }
.proc:first-child { border-top: 0; }
.proc h4 { font-size: 14.5px; font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-ctl); overflow: hidden; flex-wrap: wrap; }
.seg button { padding: 7px 11px; font-size: 12.5px; font-weight: 500; color: var(--muted); border-left: 1px solid var(--line); min-height: 36px; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); }
.seg button.na[aria-pressed="true"] { background: var(--off-ink); color: #fff; }
.seg button.unk[aria-pressed="true"] { background: var(--approval); color: #fff; }
.seg button.out[aria-pressed="true"] { background: var(--navy-2); color: #fff; }
.proc .full { grid-column: 1 / -1; }

/* assets & deps */
.asset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.asset { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 6px; background: var(--surface); }
.asset .t { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.asset b { font-weight: 600; }
.asset .ty { font-size: 11.5px; color: var(--muted); }
.ph-state { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 500; }
.ph-state.cap { color: var(--ok-ink); } .ph-state.none { color: var(--err-ink); } .ph-state.just { color: var(--approval); } .ph-state.acc { color: var(--muted); }
.dep { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 9px 14px; border-top: 1px solid var(--line-2); font-size: 13px; }
.dep:first-child { border-top: 0; }
.dep code { font-family: inherit; font-weight: 600; background: var(--surface-2); padding: 2px 8px; border-radius: 6px; }
.alert-spof { display: flex; gap: 12px; padding: 14px 16px; border-radius: var(--r-surf); background: var(--approval-soft); color: var(--ink); border: 1px solid var(--approval); }
.alert-spof .ic { color: var(--approval); margin-top: 2px; }
.alert-spof b { font-weight: 600; }

/* questionnaire */
.q { padding: 14px 18px; border-top: 1px solid var(--line-2); display: flex; flex-direction: column; gap: 10px; }
.q:first-child { border-top: 0; }
.q.cond { background: linear-gradient(90deg, var(--approval-soft), transparent 70%); }
.q-top { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.q-top .qt { font-weight: 500; font-size: 14px; max-width: 70ch; }
.q-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 11.5px; color: var(--muted); }
.q-meta code { font-family: inherit; font-weight: 600; color: var(--ink); }
.ans { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.ans button { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); font-size: 12.5px; font-weight: 500; min-height: 36px; background: var(--surface); }
.ans button:hover { border-color: var(--bright); }
.ans button[aria-pressed="true"].si { background: var(--ok-ink); border-color: var(--ok-ink); color: var(--surface); }
.ans button[aria-pressed="true"].no { background: var(--err-ink); border-color: var(--err-ink); color: var(--surface); }
.ans button[aria-pressed="true"].unk { background: var(--approval); border-color: var(--approval); color: #fff; }
.ans button[aria-pressed="true"].na { background: var(--off-ink); border-color: var(--off-ink); color: #fff; }
.q-extra { display: grid; grid-template-columns: minmax(0,1fr) 170px; gap: 10px; }
.trig { font-size: 12px; color: var(--approval); font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
.qgroup { padding: 10px 18px; background: var(--surface-2); font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; border-top: 1px solid var(--line); }

/* evidence */
.cov { display: flex; flex-direction: column; }
.cov-row { display: grid; grid-template-columns: minmax(0,1fr) 150px auto; gap: 12px; align-items: center; padding: 12px 18px; border-top: 1px solid var(--line-2); }
.cov-row:first-child { border-top: 0; }
.cov-row b { font-weight: 600; font-size: 13.5px; }
.cov-row .why { font-size: 12px; color: var(--muted); }
.cov-row .jnote { font-size: 12px; margin-top: 4px; padding: 6px 10px; border-radius: 8px; background: var(--approval-soft); color: var(--ink); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.ph { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); display: flex; flex-direction: column; text-align: left; }
.ph:hover { border-color: var(--bright); box-shadow: var(--shadow-sm); }
.ph .img { aspect-ratio: 4 / 3; background: var(--surface-2); position: relative; max-width: 100%; }
.ph .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph .img .badge { position: absolute; top: 8px; left: 8px; }
.ph .img .rep { position: absolute; top: 8px; right: 8px; }
.ph .cap { padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; }
.ph .cap b { font-size: 13px; font-weight: 600; line-height: 1.3; }
.ph .cap span { font-size: 11.5px; color: var(--muted); }
.links { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.links span { font-size: 10.5px; padding: 1px 7px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); font-weight: 500; }

/* evaluation */
.scn { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.scn-h { display: flex; gap: 10px 14px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; padding: 14px 16px; }
.scn-h b { font-size: 14.5px; font-weight: 600; }
.scn-b { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.cp { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.ctl { display: grid; grid-template-columns: minmax(0,1fr) 160px auto; gap: 8px; align-items: center; }
.mx-wrap { display: grid; grid-template-columns: 28px minmax(0,1fr); gap: 8px; }
.mx-y { writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; font-size: 11.5px; color: var(--muted); font-weight: 500; }
.mx { display: grid; grid-template-columns: 64px repeat(3, minmax(0,1fr)); gap: 4px; }
.mx .h { font-size: 11px; color: var(--muted); display: flex; align-items: center; justify-content: center; text-align: center; padding: 4px; }
.mx .c { min-height: 74px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 600; border: 2px solid transparent; }
.mx .c b { font-size: 24px; line-height: 1; }
.mx .c span { font-size: 10.5px; font-weight: 500; }
.mx .c.alto { background: var(--lv-high-bg); color: var(--lv-high); }
.mx .c.medio { background: var(--lv-med-bg); color: var(--lv-med); }
.mx .c.bajo { background: var(--lv-low-bg); color: var(--lv-low); }
.mx .c.sel { border-color: var(--ink); }
.mx .c.zero b { opacity: .35; }
.mx-x { text-align: center; font-size: 11.5px; color: var(--muted); font-weight: 500; margin-top: 6px; grid-column: 2; }

/* dashboard */
.dash-hero { position: relative; overflow: hidden; border-radius: 16px; background: var(--navy); color: #fff; padding: 24px 26px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 18px; align-items: end; }
.dash-hero > * { position: relative; }
.dash-hero h1 { font-size: 26px; font-weight: 600; }
.dash-hero p { color: #c3d0e1; font-size: 13.5px; max-width: 70ch; }
.dash-hero .eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--cyan); font-weight: 500; }
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.filters .field { min-width: 150px; flex: 1; }
.dgrid { display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); gap: 16px; }
.span-4 { grid-column: span 4; } .span-5 { grid-column: span 5; } .span-6 { grid-column: span 6; } .span-7 { grid-column: span 7; } .span-8 { grid-column: span 8; } .span-12 { grid-column: span 12; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-family: var(--font); font-size: 11px; }
.chart .lbl-strong { fill: var(--ink); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { width: 10px; height: 10px; border-radius: 2px; }
.scn-list { display: flex; flex-direction: column; }
.scn-item { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 11px 16px; border-top: 1px solid var(--line-2); text-align: left; width: 100%; }
.scn-item:hover { background: var(--surface-2); }
.scn-item:first-child { border-top: 0; }
.scn-item b { font-size: 13px; font-weight: 600; display: block; }
.scn-item span { font-size: 11.5px; color: var(--muted); }
.def { font-size: 11.5px; color: var(--muted); line-height: 1.45; }

/* journey */
.journey { display: grid; grid-template-columns: minmax(0,1fr) 340px; gap: 18px; align-items: start; }
.journey > * { min-width: 0; }
.jcanvas svg { width: 100%; height: auto; display: block; }
.jnode { cursor: pointer; }
.jnode:focus-visible { outline: none; }
.jnode:focus-visible .nb, .jnode.sel .nb { stroke: var(--cyan); stroke-width: 3; }
.jcanvas text { font-family: var(--font); }

/* report */
.sheet { aspect-ratio: 210 / 297; max-width: 100%; border-radius: 6px; overflow: hidden; box-shadow: var(--shadow); background: linear-gradient(rgba(0,28,63,.8), rgba(0,28,63,.9)), #001c3f url(assets/cover-bg.jpg) center / cover; color: #fff; padding: 9%; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
.sheet img.lg { width: 34%; }
.sheet h3 { font-size: clamp(16px, 2.2vw, 24px); font-weight: 600; line-height: 1.15; }
.sheet .ph-cov { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 4px; }
.sheet .meta { font-size: 11px; color: #c3d0e1; display: flex; flex-direction: column; gap: 2px; }
.sheet .stamp { position: absolute; top: 6%; right: 7%; font-size: 10px; font-weight: 600; letter-spacing: .08em; padding: 3px 8px; border: 1px solid currentColor; border-radius: 4px; color: #ffd28a; }
.checks { display: flex; flex-direction: column; gap: 10px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; }
.check input { width: 18px; height: 18px; margin-top: 2px; flex: none; accent-color: var(--primary); }
.toc { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 6px 12px; font-size: 13px; }
.toc span:nth-child(even) { color: var(--muted); text-align: right; }
.pdf-result { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: var(--r-surf); background: var(--ok-bg); color: var(--ok-ink); flex-wrap: wrap; }

/* config */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tabs button { padding: 10px 14px; font-size: 13.5px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--bright); }
.qrow-off td { color: var(--off-ink); }
.tog { position: relative; width: 38px; height: 22px; border-radius: 999px; background: var(--off-bg); border: 1px solid var(--line); flex: none; }
.tog::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--off-ink); transition: transform .15s; }
.tog[aria-checked="true"] { background: var(--primary); border-color: var(--primary); }
.tog[aria-checked="true"]::after { transform: translateX(16px); background: #fff; }
.cbs { display: flex; flex-wrap: wrap; gap: 8px; }
.cbs label { display: inline-flex; gap: 8px; align-items: center; min-height: 38px; padding: 6px 13px 6px 10px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 13px; font-weight: 500; color: var(--ink); white-space: nowrap; cursor: pointer; transition: border-color .15s, background .15s, color .15s; }
.cbs label:hover { border-color: var(--bright); }
.cbs label:has(input:checked) { border-color: var(--bright); background: var(--primary-soft); color: var(--primary); }
input[type=checkbox] { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; min-height: 0; margin: 0; padding: 0; flex: none; border: 1.5px solid var(--muted); border-radius: 5px; background: var(--surface); display: inline-grid; place-items: center; cursor: pointer; transition: background .15s, border-color .15s; }
input[type=checkbox]::after { content: ''; width: 9px; height: 5px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px) scale(0); transition: transform .15s; }
input[type=checkbox]:checked { background: var(--primary); border-color: var(--primary); }
input[type=checkbox]:checked::after { transform: rotate(-45deg) translate(1px, -1px) scale(1); }
input[type=checkbox]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
input[type=checkbox]:disabled { opacity: .5; cursor: not-allowed; }

/* modal & toast */
.scrim { position: fixed; inset: 0; background: rgba(0,28,63,.5); z-index: 70; display: flex; align-items: center; justify-content: center; padding: 20px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.modal { width: 100%; max-width: 720px; max-height: calc(100% - 20px); overflow-y: auto; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; }
.modal.wide { max-width: 980px; }
.modal-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line-2); position: sticky; top: 0; background: var(--surface); z-index: 1; }
.modal-h h2 { font-size: 17px; font-weight: 600; }
.modal-b { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.modal-f { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line-2); flex-wrap: wrap; position: sticky; bottom: 0; background: var(--surface); }
.drop { border: 2px dashed var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.drop.has { padding: 8px; }
.drop img { max-height: 240px; border-radius: 8px; }
.lightbox { display: grid; grid-template-columns: minmax(0,1.4fr) minmax(0,1fr); gap: 18px; }
.lightbox img { width: 100%; border-radius: 10px; background: var(--surface-2); }
.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 16px; border-radius: var(--r-ctl); font-size: 13px; z-index: 90; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.navscrim { position: fixed; inset: 0; width: 100%; height: 100%; background: rgba(0,28,63,.45); z-index: 57; cursor: pointer; border: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
.side-close { display: none; margin-left: auto; width: 40px; height: 40px; border-radius: var(--r-ctl); align-items: center; justify-content: center; color: var(--side-ink); }
.side-close:hover { background: rgba(255,255,255,.08); color: #fff; }
.seg.lang { flex-wrap: nowrap; flex: none; }
.seg.lang button { padding: 6px 10px; min-height: 34px; font-size: 12px; font-weight: 600; letter-spacing: .04em; }
.seg.lang.on-dark { border-color: rgba(201,214,230,.35); }
.seg.lang.on-dark button { color: #c3d0e1; border-left-color: rgba(201,214,230,.35); }
.seg.lang.on-dark button[aria-pressed="true"] { background: var(--cyan); color: #001c3f; }

/* ===== Redesign v0.3: people, dashboard, new-assessment flow, lighter wizard ===== */
.av { position: relative; width: 44px; height: 44px; border-radius: 50%; overflow: hidden; flex: none; background: var(--navy); display: inline-flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; font-size: 13px; }
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.av.sm { width: 32px; height: 32px; } .av.xs { width: 26px; height: 26px; font-size: 11px; }
.av.none { background: var(--off-bg); color: var(--off-ink); border: 1px dashed var(--line); }
.stack { display: inline-flex; } .stack .av { margin-left: -7px; border: 2px solid var(--surface); } .stack .av:first-child { margin-left: 0; }
.pill.nv { background: var(--navy); color: #fff; }
.roles { display: flex; flex-direction: column; gap: 8px; }
.choice { grid-template-columns: auto 1fr auto; padding: 10px 14px; }
.choice.sm { padding: 8px 12px; }
.btn.cyan { background: var(--cyan); color: #001c3f; font-weight: 600; }
.btn.cyan:hover { filter: brightness(1.06); }
.btn.warnb { background: var(--warn-bg); color: var(--warn-ink); border: 1px solid transparent; }
.btn.warnb b, .btn.ghost b { font-weight: 600; }
.grp { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .07em; text-transform: uppercase; margin-top: 6px; }
ul.plain { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.trace { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); }
.thumb { width: 64px; height: 48px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); } .thumb img { width: 100%; height: 100%; object-fit: cover; }
/* details as disclosure */
.dt { border: 1px solid var(--line); border-radius: var(--r-surf); background: var(--surface); }

<script id="v74-sum-js">
/* v74 · reemplaza app/v7-sum.js (v70) */
/* ORA v7 — Resumen del assessment: siguiente paso, etapas, calidad del dato y lo que más importa. */
(function () {
  const C = window.ORA, U = window.ORA_UI, I = window.ORA_I18N;
  const h = C.esc, L = I.L, tx = I.tx, ic = U.ic, A = U.act;
  const pl = (n, s, p) => n + ' ' + (n === 1 ? s : p);

  // calidad del dato: Propuesto / Aceptado / Verificado sobre el inventario vigente (+ propuestas de omnIA pendientes)
  U.dataQuality = function (a) {
    const c = { prop: 0, acc: 0, ver: 0 };
    [['area', a.areas], ['system', a.systems], ['asset', a.assets], ['dep', a.deps]].forEach(([k, l]) => (l || []).forEach(x => {
      const m = C.mat(a, k, x); if (m === 'descartado') return;
      if (m === 'sugerido') c.prop++; else if (m === 'aceptado') c.acc++; else c.ver++; }));
    c.prop += U.propCount ? U.propCount(a) : 0;
    c.tot = c.prop + c.acc + c.ver; c.okPct = c.tot ? Math.round((c.acc + c.ver) / c.tot * 100) : 0; c.verPct = c.tot ? Math.round(c.ver / c.tot * 100) : 0;
    return c;
  };
  U.dqBar = function (c, big) {
    const seg = (k, n, l) => n ? `<i class="dq-${k}" style="flex:${n}" title="${l}: ${n}"></i>` : '';
    return `<div class="v7-dq ${big ? 'big' : ''}"><div class="v7-dqb">${c.tot ? seg('prop', c.prop, L('Propuesto', 'Proposed')) + seg('acc', c.acc, L('Aceptado', 'Accepted')) + seg('ver', c.ver, L('Verificado', 'Verified')) : '<i class="dq-none" style="flex:1"></i>'}</div>
      <div class="v7-dql"><span><i class="dq-prop"></i>${L('Propuesto', 'Proposed')} <b>${c.prop}</b></span><span><i class="dq-acc"></i>${L('Aceptado', 'Accepted')} <b>${c.acc}</b></span><span><i class="dq-ver"></i>${L('Verificado', 'Verified')} <b>${c.ver}</b></span></div></div>`;
  };

  function nextStep(a, ev) {
    const secs = U.SECS();
    const withProps = secs.map(s => ({ s, n: U.propCount ? U.propCount(a, s.k) : 0 })).filter(x => x.n).sort((x, y) => y.n - x.n);
    if (withProps.length) { const x = withProps[0]; return { k: L('Propuestas de omnIA', 'omnIA proposals'), t: L(`${x.s.name} tiene ${pl(x.n, 'propuesta', 'propuestas')} por revisar`, `${x.s.name} has ${pl(x.n, 'proposal', 'proposals')} to review`), d: L('Acéptalas, edítalas o recházalas: nada entra al análisis sin tu decisión.', 'Accept, edit or reject them: nothing enters the analysis without your decision.'), btn: `<button class="btn primary" data-act="v7-sec" data-sec="${x.s.k}">${L('Revisar', 'Review')}${ic('chev', 'sm')}</button>`, ai: true }; }
    if (U.ingestCTA && !(a.sources || []).length && !(a.props || []).length && !a.areas.length) return { k: L('Empieza aquí', 'Start here'), t: L('Dale a omnIA tus entrevistas, notas y documentos', 'Give omnIA your interviews, notes and documents'), d: L('Prepara un primer borrador del assessment con la fuente de cada dato. Tú decides qué entra.', 'It drafts the assessment with the source of every data point. You decide what goes in.'), btn: `<button class="btn primary" data-act="ing-open">${ic('spark', 'sm')}${L('Iniciar con omnIA', 'Start with omnIA')}</button>`, ai: true };
    const st = ev.stages.find(s => s.items.some(i => i.sev !== 'sug'));
    if (st) { const nx = st.items.filter(i => i.sev !== 'sug').sort((x, y) => C.SEV_ORDER[x.sev] - C.SEV_ORDER[y.sev])[0]; const s = secs.find(x => x.st.includes(st.n));
      return { k: s ? s.n + '. ' + s.name : st.name, t: nx.title, d: nx.reason, btn: `<button class="btn primary" data-act="go" data-stage="${st.n}" data-target="${h(nx.target || '')}">${L('Ir', 'Go')}${ic('chev', 'sm')}</button>` }; }
    return { k: L('Todo al día', 'All up to date'), t: L('El assessment está listo para presentar resultados', 'The assessment is ready to present results'), d: L('Revisa el tablero y genera el informe para el cliente.', 'Review the dashboard and generate the client report.'), btn: `<button class="btn primary" data-act="v7-sec" data-sec="res">${ic('radar', 'sm')}${L('Ver resultados', 'See results')}</button>` };
  }

  // Resumen v74: ¿cómo vamos? · ¿qué hago ahora? · ¿qué hemos encontrado? — cada dato aparece una sola vez
  const missTxt = r => { const m = /^(Falta: |Missing: )(.*)$/.exec(r || ''); return m ? L('Falta completar: ', 'Still missing: ') + m[2].toLowerCase() : (r || ''); };
  const FLV = { proceso: ['Proceso', 'Process'], activo: ['Activo', 'Asset'], sistema: ['Sistema', 'System'], dependencia: ['Dependencia', 'Dependency'], area: ['Área', 'Area'] };
  U.views.summary = function (a, ev) {
    const secs = U.SECS(); const ns = nextStep(a, ev); const dq = U.dataQuality(a);
    const sst = secs.map(s => ({ s, ss: U.secState(ev, s), np: U.propCount ? U.propCount(a, s.k) : 0 }));
    const pendTot = sst.reduce((n, x) => n + x.ss.pend, 0);
    // 1 · avance: una sola barra dividida en las seis etapas
    const segs = sst.map(({ s, ss }) => `<button class="v7s-seg st-${ss.state}" data-n="${s.n}" data-act="v7-sec" data-sec="${s.k}" aria-label="${h(s.n + '. ' + s.name + ': ' + (ss.state === 'complete' ? L('completa', 'complete') : ss.pct ? ss.pct + ' %' : L('sin iniciar', 'not started')))}">
        <span class="v7s-bar"><i style="width:${ss.pct}%"></i></span><b>${s.n}. ${h(s.name)}</b><small>${ss.state === 'complete' ? L('Completa', 'Complete') : ss.pct ? ss.pct + ' % · ' + L('en curso', 'in progress') : L('Sin iniciar', 'Not started')}</small></button>`).join('');
    const ids = [a.leadId, ...(a.team || []).filter(x => x !== a.leadId)].filter(Boolean);
    const prog = `<section class="v7s-prog" aria-labelledby="v7s-t"><div class="v7s-ph"><div class="v7s-pt"><span class="v7s-code">${h(a.code)} · ${h(C.modName(C.mod(a)))}</span><h1 id="v7s-t">${h(tx(a.cfg.plant) || L('Nuevo assessment', 'New assessment'))}</h1><p>${h(tx(a.cfg.client) || L('Cliente por definir', 'Client to be defined'))}</p></div>
        <div class="v7s-pn"><b>${ev.pct} %</b><small>${L(`${ev.done} de ${ev.total} criterios completos`, `${ev.done} of ${ev.total} criteria complete`)}</small></div></div>
      <div class="v7s-segs">${segs}</div>
      <div class="v7s-pf"><button class="v7s-team" data-act="nav" data-view="team">${U.stack(ids)}<span>${L('Equipo e historial', 'Team & history')}</span></button></div></section>`;
    // 2 · siguiente paso + hasta dos pendientes más
    let used = null; const st0 = ev.stages.find(s => s.items.some(i => i.sev !== 'sug'));
    if (!ns.ai && st0) used = st0.items.filter(i => i.sev !== 'sug').sort((x, y) => C.SEV_ORDER[x.sev] - C.SEV_ORDER[y.sev])[0];
    const more = [];
    sst.filter(x => x.np).sort((x, y) => y.np - x.np).forEach(({ s, np }) => { if (!(ns.ai && ns.t.indexOf(s.name) === 0)) more.push({ ai: true, t: L(`Revisa ${pl(np, 'propuesta', 'propuestas')} de omnIA`, `Review ${pl(np, 'omnIA proposal', 'omnIA proposals')}`), d: s.name, btn: `<button class="btn ghost sm" data-act="v7-sec" data-sec="${s.k}">${L('Revisar', 'Review')}</button>` }); });
    ev.stages.forEach(st => { const s = secs.find(x => x.st.includes(st.n)); st.items.filter(i => i.sev !== 'sug' && i !== used).sort((x, y) => C.SEV_ORDER[x.sev] - C.SEV_ORDER[y.sev]).slice(0, 1).forEach(i => more.push({ t: i.title, d: (s ? s.n + '. ' + s.name : st.name) + (i.reason ? ' · ' + missTxt(i.reason) : ''), btn: `<button class="btn ghost sm" data-act="go" data-stage="${st.n}" data-target="${h(i.target || '')}">${L('Completar', 'Complete')}</button>` })); });
    const nsCtx = used && st0 ? (secs.find(x => x.st.includes(st0.n)) || {}) : null;
    const nsMain = nsCtx ? { k: nsCtx.n + '. ' + nsCtx.name, t: ns.t, d: missTxt(ns.d), btn: ns.btn.replace(/>[^<]*Ir|>[^<]*Go/, '>' + L('Completar', 'Complete')) } : ns;
    const next = `<section class="v7s-sec" aria-labelledby="v7s-n"><h2 id="v7s-n" class="v7s-h">${L('Siguiente paso', 'Next step')}</h2>
      <div class="v7s-main ${ns.ai ? 'ai' : ''}"><div><span class="v7s-ctx">${ns.ai ? ic('spark', 'sm') : ''}${h(nsMain.k)}</span><b>${h(nsMain.t)}</b>${nsMain.d ? `<p>${h(nsMain.d)}</p>` : ''}</div>${nsMain.btn}</div>
      ${more.length || pendTot ? `<div class="v7s-list">${more.slice(0, 2).map(m => `<div class="v7s-row">${m.ai ? `<span class="v7-chip ai">${ic('spark', 'sm')}omnIA</span>` : `<span class="v7-chip warn">${L('Pendiente', 'Pending')}</span>`}<span class="v7s-rt"><b>${h(m.t)}</b><small>${h(m.d)}</small></span>${m.btn}</div>`).join('')}
        ${pendTot ? `<button class="v7s-all" data-act="pend-open">${L(`Ver los ${pendTot} pendientes por etapa`, `See all ${pendTot} pending items by stage`)}</button>` : ''}</div>` : ''}</section>`;
    // 3 · lo que hemos encontrado
    const fs = a.findings || []; const fver = fs.filter(f => /pendiente|verif/i.test(f.status || '')).length;
    const ex = C.expo ? C.expo(a) : null; const lv = { Alto: 0, Medio: 1, Bajo: 2 };
    const scored = (a.scenarios || []).map(s => ({ s, l: C.LEVEL(s.C, s.P) })).filter(x => x.l);
    const top = scored.slice().sort((x, y) => lv[x.l] - lv[y.l]).slice(0, 3);
    const tile = (k, v, d, act) => `<${act ? `button class="v7s-tile" ${act}` : 'div class="v7s-tile"'}><small>${k}</small>${v}<span>${d}</span></${act ? 'button' : 'div'}>`;
    const exV = ex && ex.ok.length ? `<b>${U.money(ex.tot.min)}${ex.tot.max !== ex.tot.min ? ' – ' + U.money(ex.tot.max) : ''}</b>` : `<b class="sm">${L('Aún no se puede calcular', 'Not available yet')}</b>`;
    const exD = ex && ex.ok.length ? L(`por parada, con ${pl(ex.ok.length, 'proceso', 'procesos')}`, `per outage, from ${pl(ex.ok.length, 'process', 'processes')}`) : L('Falta la tolerancia, la recuperación o el costo de parada de los procesos.', 'Process tolerance, recovery or outage cost is still missing.');
    const tiles = tile(L('Hallazgos', 'Findings'), `<b>${fs.length}</b>`, fs.length ? (fver ? L(`${fver} por verificar`, `${fver} to verify`) : L('todos confirmados', 'all confirmed')) : L('Se registran en campo o desde documentos.', 'Recorded on site or from documents.'))
      + tile(L('Exposición en dinero', 'Money at risk'), exV, exD)
      + tile(L('Riesgos evaluados', 'Assessed risks'), scored.length ? `<b>${scored.length}</b>` : `<b class="sm">${L('Desde la etapa 5', 'From stage 5')}</b>`, scored.length ? L(`${scored.filter(x => x.l === 'Alto').length} de nivel alto`, `${scored.filter(x => x.l === 'Alto').length} high`) : L('Aparecerán al evaluar escenarios.', 'They appear once scenarios are assessed.'))
      + tile(L('Confianza del dato', 'Data confidence'), `<b>${dq.okPct} %</b>`, dq.tot ? L(`cuenta para el análisis; ${dq.verPct} % verificado`, `counts for the analysis; ${dq.verPct}% verified`) : L('Aún no hay inventario.', 'No inventory yet.'));
    const fOrd = { confirmado: 0 }; const topF = fs.slice().sort((x, y) => (fOrd[x.status] ?? 1) - (fOrd[y.status] ?? 1)).slice(0, 3);
    const list = top.length ? `<div class="v7s-list"><div class="v7s-lh">${L('Riesgos principales', 'Top risks')}</div>${top.map(({ s, l }) => `<button class="v7s-row link" data-act="go" data-stage="6" data-target="scn-${h(s.id)}">${U.lv(l)}<span class="v7s-rt"><b>${h(tx(s.title))}</b><small>${h(C.procName(a, s.proc))}</small></span>${ic('chev', 'sm')}</button>`).join('')}</div>`
      : topF.length ? `<div class="v7s-list"><div class="v7s-lh">${L('Hallazgos más relevantes', 'Key findings')}</div>${topF.map(f => `<button class="v7s-row link" data-act="go" data-stage="6" data-target="finding-${h(f.id)}"><code>${h(f.id)}</code><span class="v7s-rt"><b>${h(tx(f.title))}</b></span>${FLV[f.level] ? `<span class="v7-chip">${L(FLV[f.level][0], FLV[f.level][1])}</span>` : ''}${ic('chev', 'sm')}</button>`).join('')}${fs.length > 3 ? `<button class="v7s-all" data-act="go" data-stage="6">${L(`Ver los ${fs.length} hallazgos`, `See all ${fs.length} findings`)}</button>` : ''}</div>` : '';
    const found = `<section class="v7s-sec" aria-labelledby="v7s-f"><h2 id="v7s-f" class="v7s-h">${L('Lo que hemos encontrado', 'What we have found')}</h2><div class="v7s-tiles">${tiles}</div>${list}</section>`;
    return `<div class="v7s">${prog}${next}${U.ingestCTA ? U.ingestCTA(a, ev) : ''}${found}</div>`;
  };
  // la nueva vista vive dentro del assessment abierto
  const r0 = U.render;
  U.render = function () { if (C.S.ui.view === 'summary' && !C.cur()) C.S.ui.view = 'home'; document.body.classList.toggle('v7-on-sum', C.S.ui.view === 'summary'); return r0.apply(this, arguments); };
  // crear un assessment lleva al Resumen
  const nc0 = A['new-create']; A['new-create'] = function () { nc0.apply(this, arguments); if (C.cur() && C.S.ui.view === 'wizard') { C.S.ui.view = 'summary'; C.save(); U.render(); } };

  // ⓘ: ayuda bajo demanda que se abre al tocar (globo en escritorio, hoja inferior en celular)
  U.info = (txt, title) => `<button class="v7-i" data-act="v7-info" data-t="${h(title || '')}" data-x="${h(txt)}" aria-label="${L('Más información', 'More information')}">i</button>`;
  A['v7-info'] = el => {
    document.querySelectorAll('.v7-pop').forEach(x => x.remove());

/* v75–v76 · Preguntas fáciles en campo: cada dato es una pregunta que se responde o edita en su sitio,
   las opciones se guardan con un toque y todo campo de texto tiene micrófono. */
(function () {
  const C = window.ORA, U = window.ORA_UI, I = window.ORA_I18N;
  const h = C.esc, L = I.L, tx = I.tx, ic = U.ic, A = U.act;
  const R = () => U.render();
  const now = () => new Date().toISOString();
  const me = () => C.uname(C.S.userId);
  let QE = null;          // pregunta abierta: { k: proceso, f: campo } o { q: id de pregunta }
  let SCROLL = false; let OPENING = null; let TARGET = null; // proceso al que se llegó desde un pendiente
  const DOT = `<span class="q76-dot" aria-hidden="true"></span>`;     // llevar la pregunta abierta a la vista tras pintar
  const MORE = new Set(); // procesos con «Más contexto» abierto
  const DETAIL = new Set(); // preguntas del cuestionario en vista de evidencia y hallazgos

  // ---------- micrófono en un campo ----------
  U.mic75 = id => `<button type="button" class="q75-mic" data-act="q75-mic" data-for="${id}" aria-label="${L('Dictar con el micrófono', 'Dictate with the microphone')}" title="${L('Dictar', 'Dictate')}">${ic('mic', 'sm')}</button>`;
  A['q75-mic'] = el => {
    const f = document.getElementById(el.dataset.for); if (!f) return;
    if (U.dictOn) { U.dictStop(); return; }
    el.classList.add('on');
    U.dictate(t => { f.value = (f.value && f.value.trim() ? f.value.replace(/\s+$/, '') + ' ' : '') + t; f.dispatchEvent(new Event('input', { bubbles: true })); },
      () => { el.classList.remove('on'); f.dispatchEvent(new Event('change', { bubbles: true })); try { f.focus(); } catch (e) {} }, { keep: true });
  };
  // a todo campo de texto de la app se le agrega micrófono
  let SEQ = 0;
  function micify(root) {
    (root || document).querySelectorAll('#main textarea, #main input[type="text"], #main input:not([type]), .modal textarea, .modal input[type="text"], .modal input:not([type])').forEach(f => {
      if (f.dataset.nomic || f.readOnly || f.disabled || f.closest('.q75-mw') || f.closest('.v7-live')) return;
      if (f.offsetWidth && f.offsetWidth < 150) return;
      if (/search|buscar/i.test((f.getAttribute('placeholder') || '') + ' ' + (f.getAttribute('aria-label') || '')) && f.tagName === 'INPUT') return;
      if (!f.id) f.id = 'q75f-' + (++SEQ);
      const w = document.createElement('span'); w.className = 'q75-mw' + (f.tagName === 'TEXTAREA' ? ' ta' : '');
      f.parentNode.insertBefore(w, f); w.appendChild(f); w.insertAdjacentHTML('beforeend', U.mic75(f.id));
    });
  }

  // ---------- piezas comunes ----------
  const row = (o) => `<div class="q75r ${o.open ? 'open' : ''} ${o.miss ? 'miss' : ''}" id="${o.id}">
      ${o.open ? `<div class="q75r-h static"><span class="q75r-t"><span class="q75r-q">${o.q}${o.miss ? `<span class="q75-falta">${L('Falta', 'Missing')}</span>` : ''}</span>${o.help ? `<span class="q75r-help">${o.help}</span>` : ''}</span></div>`
        : `<button class="q75r-h" data-act="${o.act}" ${o.data} aria-label="${h((o.val ? L('Editar: ', 'Edit: ') : L('Responder: ', 'Answer: ')) + o.qPlain)}"><span class="q75r-t"><span class="q75r-q">${o.q}${o.miss ? `<span class="q75-falta">${L('Falta', 'Missing')}</span>` : ''}</span><span class="q75r-v ${o.val ? '' : 'empty'}">${o.val || L('Sin responder', 'Not answered')}</span></span><span class="q75r-e">${o.val ? L('Editar', 'Edit') : L('Responder', 'Answer')}</span></button>`}
      ${o.open ? `<div class="q75r-ed">${o.editor}</div>` : ''}</div>`;
  const actions = (save, extra) => `<div class="q75-act">${extra || ''}<span class="q75-sp"></span><button class="btn ghost sm" data-act="q75-cancel">${L('Cancelar', 'Cancel')}</button><button class="btn primary sm" data-act="${save}">${ic('check', 'sm')}${L('Guardar', 'Save')}</button></div>`;
  A['q75-cancel'] = () => { QE = null; R(); };

  // círculo con el número de preguntas por responder (verde con ✓ cuando no falta ninguna)
  U.cnt76 = n => `<span class="q76-cnt ${n ? '' : 'ok'}" role="img" aria-label="${h(n ? L(`${n} ${n === 1 ? 'pregunta' : 'preguntas'} por responder`, `${n} ${n === 1 ? 'question' : 'questions'} to answer`) : L('Obligatorias completas', 'Required answers complete'))}" title="${h(n ? L(`${n} por responder`, `${n} to answer`) : L('Completo', 'Complete'))}">${n || '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'}</span>`;
  // ---------- Alcance: preguntas de cada proceso crítico ----------
  const TYPE = () => [['productivo', L('Productivo', 'Production'), L('Genera el producto o servicio', 'Produces the product or service')], ['auxiliar', L('Servicio auxiliar', 'Auxiliary service'), L('Apoya a otros procesos', 'Supports other processes')], ['salvaguarda', L('Salvaguarda', 'Safeguard'), L('Protege personas y planta', 'Protects people and plant')]];
  const CRIT = () => [['Alta', L('Alta', 'High'), L('Detenerlo para la operación', 'Stopping it halts operations')], ['Media', L('Media', 'Medium'), L('Afecta, pero hay cómo seguir', 'It hurts, but operations go on')], ['Baja', L('Baja', 'Low'), L('Impacto menor', 'Minor impact')]];
  const TOL = [[30, 'min', '30 min'], [1, 'h', '1 h'], [2, 'h', '2 h'], [4, 'h', '4 h'], [8, 'h', '8 h'], [24, 'h', '24 h']];
  const fmtTol = t => !t || t.value == null || t.value === '' ? '' : t.value + ' ' + (t.unit === 'días' ? L('días', 'days') : t.unit);
  const PF = () => ({
    just: { q: L('¿Por qué entra en la evaluación?', 'Why is it included in the assessment?'), kind: 'long', get: p => p.just },
    crit: { q: L('¿Qué tan crítico es para el negocio?', 'How critical is it to the business?'), kind: 'choice', opts: CRIT, get: p => p.crit },
    type: { q: L('¿Qué tipo de proceso es?', 'What type of process is it?'), kind: 'choice', opts: TYPE, get: p => p.type },
    interruption: { q: L('¿Qué pasa si se detiene?', 'What happens if it stops?'), kind: 'long', get: p => p.interruption },
    tol: { q: L('¿Cuánto tiempo puede estar detenido?', 'How long can it be stopped?'), help: L('Antes de que el impacto sea inaceptable. Con este dato se calcula la exposición en dinero.', 'Before the impact becomes unacceptable. It is used to estimate money at risk.'), kind: 'time', get: p => fmtTol(p.tolerance) },
    function: { q: L('¿Qué hace este proceso?', 'What does this process do?'), kind: 'text', get: p => p.function },
    capacityAffected: { q: L('¿Qué parte de la capacidad se pierde si se detiene?', 'How much capacity is lost if it stops?'), kind: 'text', ph: L('p. ej. 100 % del despacho', 'e.g. 100% of dispatch'), get: p => p.capacityAffected },
    tolsrc: { q: L('¿De dónde sale el dato de tolerancia?', 'Where does the tolerance figure come from?'), kind: 'text', ph: L('Contrato, permiso, entrevista…', 'Contract, permit, interview…'), get: p => (p.tolerance || {}).source },
    constraints: { q: L('¿Hay restricciones para detenerlo o intervenirlo?', 'Are there constraints on stopping or working on it?'), kind: 'text', ph: L('Ventanas de parada, contratos…', 'Shutdown windows, contracts…'), get: p => p.constraints },
    source: { q: L('¿Quién o qué documento sustenta estas respuestas?', 'Who or what document supports these answers?'), kind: 'text', ph: L('Entrevista, procedimiento, contrato…', 'Interview, procedure, contract…'), get: p => p.source }
  });
  const REQ = p => ['just', 'crit', 'type', 'interruption'].concat(p.type === 'salvaguarda' ? [] : ['tol']);
  const OPTF = p => ['function', 'capacityAffected'].concat(p.type === 'salvaguarda' ? [] : ['tolsrc']).concat(['constraints', 'source']);
  const shown = (f, p, v) => { const d = PF()[f]; if (d.kind === 'choice') { const o = d.opts().find(x => x[0] === v); return o ? h(o[1]) : (v ? h(tx(v)) : ''); } return v ? h(tx(String(v))) : ''; };

  function editorFor(p, f, editing) {
    const d = PF()[f], v = d.get(p);
    const cancel = editing ? `<button class="btn ghost sm" data-act="q75-cancel">${L('Cancelar', 'Cancel')}</button>` : '';
    if (d.kind === 'choice') return `<div class="q75-opts" role="radiogroup" aria-label="${h(d.q)}">${d.opts().map(o => `<button role="radio" aria-checked="${v === o[0]}" class="${v === o[0] ? 'on' : ''}" data-act="q75-pset" data-k="${p.key}" data-f="${f}" data-v="${o[0]}"><b>${o[1]}</b><small>${o[2]}</small></button>`).join('')}</div>${cancel ? `<div class="q75-act"><span class="q75-sp"></span>${cancel}</div>` : ''}`;
    if (d.kind === 'time') { const t = p.tolerance || {}; const tv = 'q76-tv-' + p.key, tu = 'q76-tu-' + p.key;
      return `<div class="q75-chips" role="radiogroup" aria-label="${h(d.q)}">${TOL.map(o => { const on = +t.value === o[0] && t.unit === o[1]; return `<button role="radio" aria-checked="${on}" class="${on ? 'on' : ''}" data-act="q75-tol" data-k="${p.key}" data-v="${o[0]}" data-u="${o[1]}">${o[2]}</button>`; }).join('')}</div>
        <details class="q76-other" ${t.value != null && t.value !== '' && !TOL.some(o => +t.value === o[0] && t.unit === o[1]) ? 'open' : ''}><summary>${L('Otro valor', 'Other value')}</summary><div class="q75-other"><span><input id="${tv}" type="number" min="0" inputmode="decimal" aria-label="${L('Valor', 'Value')}" value="${t.value != null && !TOL.some(o => +t.value === o[0] && t.unit === o[1]) ? h(String(t.value)) : ''}" placeholder="12"><select id="${tu}" aria-label="${L('Unidad', 'Unit')}">${[['h', L('horas', 'hours')], ['min', L('minutos', 'minutes')], ['días', L('días', 'days')]].map(o => U.opt(o[0], o[1], t.unit || 'h')).join('')}</select><button class="btn primary sm" data-act="q75-tolsave" data-k="${p.key}">${ic('check', 'sm')}${L('Guardar', 'Save')}</button></span></div></details>
        ${cancel ? `<div class="q75-act"><span class="q75-sp"></span>${cancel}</div>` : ''}`; }
    const id = `q76-in-${p.key}-${f}`;
    const fld = d.kind === 'long' ? `<textarea id="${id}" rows="${editing ? 3 : 2}" placeholder="${h(d.ph || L('Escriba o toque el micrófono', 'Type or tap the microphone'))}">${h(tx(v || ''))}</textarea>` : `<input id="${id}" type="text" value="${h(tx(v || ''))}" placeholder="${h(d.ph || L('Escriba o toque el micrófono', 'Type or tap the microphone'))}" enterkeyhint="done">`;
    return `<span class="q75-mw ${d.kind === 'long' ? 'ta' : ''}">${fld}${U.mic75(id)}</span><div class="q75-act"><span class="q75-sp"></span>${cancel}<button class="btn primary sm" data-act="q75-psave" data-k="${p.key}" data-f="${f}" data-for="${id}">${ic('check', 'sm')}${L('Guardar', 'Save')}</button></div>`;
  }
  function procBody(a, p) {
    const pf = PF(), req = REQ(p), opt = OPTF(p);
    const done = req.filter(f => String(pf[f].get(p) || '').trim()).length, od = opt.filter(f => String(pf[f].get(p) || '').trim()).length;
    const mk = (f, isReq) => { const v = pf[f].get(p); const has = !!String(v || '').trim(); const editing = !!(QE && QE.k === p.key && QE.f === f);
      if (has && !editing) return `<button class="q75r-h q76-ans" id="q75-${p.key}-${f}" data-act="q75-popen" data-k="${p.key}" data-f="${f}" aria-label="${h(L('Editar: ', 'Edit: ') + pf[f].q)}"><span class="q75r-t"><span class="q75r-q">${h(pf[f].q)}</span><span class="q75r-v">${shown(f, p, v)}</span></span><span class="q75r-e">${L('Editar', 'Edit')}</span></button>`;
      return `<div class="q76o ${has ? 'editing' : 'pend'}" id="q75-${p.key}-${f}"><div class="q76o-q">${!has && isReq ? DOT : ''}<span>${h(pf[f].q)}</span></div>${pf[f].help ? `<div class="q76o-help">${h(pf[f].help)}</div>` : ''}${editorFor(p, f, editing)}</div>`; };
    const ST = [['incluido', L('Se evalúa', 'Assessed')], ['na', L('No aplica', 'Not applicable')], ['fuera', L('Fuera del alcance', 'Out of scope')], ['desconocido', L('No se sabe', 'Unknown')]];
    const moreOpen = MORE.has(p.key) || (QE && QE.k === p.key && opt.includes(QE.f));
    return `<div class="q75">
      <div class="q75-top"><div class="q75-dec" role="radiogroup" aria-label="${L('Decisión sobre el proceso', 'Decision on the process')}">${ST.map(s => `<button role="radio" aria-checked="${p.status === s[0]}" class="${p.status === s[0] ? 'on' : ''}" data-act="proc-status" data-k="${p.key}" data-v="${s[0]}">${s[1]}</button>`).join('')}</div>
        <div class="q75-prog"><span class="q75-bar"><i style="width:${Math.round(done / req.length * 100)}%" class="${done === req.length ? 'ok' : ''}"></i></span>${U.cnt76(req.length - done)}</div></div>

      ${req.map(f => mk(f, true)).join('')}
      ${p.type === 'salvaguarda' ? `<p class="q75-note">${L('Salvaguarda: protege personas y planta; la tolerancia no aplica.', 'Safeguard: protects people and plant; tolerance does not apply.')}</p>` : ''}
      <button class="q75-more" data-act="q75-more" data-k="${p.key}" aria-expanded="${moreOpen}"><span><b>${L('Más contexto, opcional', 'More context, optional')}</b><small>${L(`${od} de ${opt.length} respondidas. Sirven para el informe y no bloquean el avance.`, `${od} of ${opt.length} answered. They feed the report and do not block progress.`)}</small></span><em>${moreOpen ? L('Ocultar', 'Hide') : L('Mostrar', 'Show')}</em></button>
      ${moreOpen ? opt.map(f => mk(f, false)).join('') : ''}
      <p class="trace">${ic('clock', 'sm')}${L('Decisión registrada por', 'Decision recorded by')} ${h(p.by || C.uname(a.leadId) || '—')}${p.ts ? ' · ' + C.fmtDate(p.ts, true) : ''}</p></div>`;
  }
  const procOf = k => { const a = C.cur(); return a && a.processes.find(x => x.key === k); };
  A['q75-popen'] = el => { QE = { k: el.dataset.k, f: el.dataset.f }; SCROLL = true; R(); };
  A['q75-more'] = el => { const k = el.dataset.k; if (MORE.has(k)) MORE.delete(k); else MORE.add(k); if (QE && QE.k === k && OPTF(procOf(k)).includes(QE.f)) QE = null; R(); };
  function setP(p, f, v, lblEs, lblEn) {
    const a = C.cur();
    if (f === 'tolsrc') { p.tolerance = Object.assign({}, p.tolerance || {}, { source: v }); }
    else if (f) p[f] = v;
    p.by = p.by || me();
    C.log(a, `Actualizó «${lblEs}» de ${tx(p.name)}`, `Updated “${lblEn}” of ${tx(p.name)}`);
    QE = null; C.save(); R(); U.toast(L('Guardado', 'Saved'));
  }
  const lbls = f => [{ just: 'justificación', crit: 'criticidad', type: 'tipo de proceso', interruption: 'consecuencia de una interrupción', tol: 'tolerancia', function: 'función', capacityAffected: 'capacidad afectada', tolsrc: 'fuente de la tolerancia', constraints: 'restricciones', source: 'fuente' }[f], { just: 'justification', crit: 'criticality', type: 'process type', interruption: 'consequence of an interruption', tol: 'tolerance', function: 'function', capacityAffected: 'capacity affected', tolsrc: 'tolerance source', constraints: 'constraints', source: 'source' }[f]];
  A['q75-pset'] = el => { const p = procOf(el.dataset.k); if (!p) return; const [e, n] = lbls(el.dataset.f); setP(p, el.dataset.f, el.dataset.v, e, n); };
  A['q75-psave'] = el => { const p = procOf(el.dataset.k); const f = el.dataset.f; const i = document.getElementById(el.dataset.for); if (!p || !i) return; const v = i.value.trim();
    if (!v && REQ(p).includes(f)) { i.focus(); return U.toast(L('Escriba o dicte la respuesta', 'Type or dictate the answer')); } const [e, n] = lbls(f); setP(p, f, v, e, n); };
  const setTol = (p, value, unit) => { const t = p.tolerance || {}; p.tolerance = Object.assign({}, t, { value, unit, conf: t.conf || 'Declarado' }); const [e, n] = lbls('tol'); setP(p, null, null, e, n); };
  A['q75-tol'] = el => { const p = procOf(el.dataset.k); if (!p) return; setTol(p, +el.dataset.v, el.dataset.u); };
  A['q75-tolsave'] = el => { const p = procOf(el.dataset.k); if (!p) return; const v = (document.getElementById('q76-tv-' + p.key) || {}).value; if (v === '' || isNaN(+v)) { const i = document.getElementById('q76-tv-' + p.key); if (i) i.focus(); return U.toast(L('Elija un tiempo o escriba otro valor', 'Pick a time or type another value')); } setTol(p, +v, (document.getElementById('q76-tu-' + p.key) || {}).value || 'h'); };

  // ---------- Cuestionario: responder con un toque ----------
  const VALS = () => [['Sí', L('Sí', 'Yes'), 'si'], ['No', L('No', 'No'), 'no'], ['Desconocido', L('No se sabe', 'Unknown'), 'unk'], ['No aplica', L('No aplica', 'N/A'), 'na']];
  const qCard0 = U.qCard;
  U.qCard = function (a, x, disBtn) {
    const q = x.q;
    if (DETAIL.has(q.id) && qCard0) return `<div class="q75-detail">${qCard0(a, x, disBtn)}<button class="plink q75-back" data-act="q75-qsimple" data-q="${q.id}">${L('Volver a la vista rápida', 'Back to quick view')}</button></div>`;
    const r = a.answers[q.id] || {}; const ok = C.answerOK(a, q); const open = QE && QE.q === q.id;
    const nph = C.evPhotos(a, 'q', q.id).length + C.evDocs(a, 'q', q.id).length, nf = a.findings.filter(f => f.q === q.id).length;
    const meta = [tx(q.dim || ''), q.proc ? C.procName(a, q.proc) : '', !q.req && !x.cond ? L('Complementaria', 'Supplementary') : ''].filter(Boolean).join(' · ');
    const needNote = r.value === 'No aplica' && !(r.note || '').trim();
    const noteEd = open ? `<div class="q75r-ed"><label class="q75-lbl" for="q75-qn">${r.value === 'No aplica' ? L('¿Por qué no aplica?', 'Why does it not apply?') : r.value === 'Desconocido' ? L('¿Qué se sabe y cómo verificarlo?', 'What is known and how to verify it?') : L('Explicación y fuente', 'Explanation and source')}</label>
        <span class="q75-mw ta"><textarea id="q75-qn" rows="3" placeholder="${L('Escriba o dicte', 'Type or dictate')}">${h(tx(r.note || ''))}</textarea>${U.mic75('q75-qn')}</span>
        <div class="q75-conf" role="radiogroup" aria-label="${L('Confianza', 'Confidence')}">${[['Estimado', L('Estimado', 'Estimated')], ['Verificado', L('Verificado', 'Verified')]].map(o => `<button role="radio" aria-checked="${(r.conf || 'Estimado') === o[0]}" class="${(r.conf || 'Estimado') === o[0] ? 'on' : ''}" data-act="q75-qconf" data-q="${q.id}" data-v="${o[0]}">${o[1]}</button>`).join('')}</div>
        ${actions('q75-qsave').replace('data-act="q75-qsave"', `data-act="q75-qsave" data-q="${q.id}"`)}</div>` : '';
    return `<article class="q75q ${ok ? 'ok' : ''} ${x.cond ? 'cond' : ''}" id="q-${q.id}">
      <div class="q75q-h"><span class="q75q-t"><b>${!r.value || needNote ? DOT : ''}${h(tx(q.text))}</b><small><code>${q.id}</code>${meta ? ' · ' + h(meta) : ''}${x.cond ? ` · ${ic('branch', 'sm')}${h(x.why || L('Condicional', 'Conditional'))}` : ''}</small></span>${disBtn || ''}</div>
      <div class="q75-ans" role="radiogroup" aria-label="${L('Respuesta', 'Answer')}">${VALS().map(v => `<button role="radio" aria-checked="${r.value === v[0]}" class="${v[2]} ${r.value === v[0] ? 'on' : ''}" data-act="q75-qans" data-q="${q.id}" data-v="${v[0]}">${v[1]}</button>`).join('')}</div>
      ${open ? noteEd : r.value ? `<div class="q75q-f">${(r.note || '').trim() ? `<button class="q75q-note" data-act="q75-qopen" data-q="${q.id}"><span>${h(tx(r.note))}</span><em>${L('Editar', 'Edit')}</em></button>` : `<button class="plink ${needNote ? 'warnl' : ''}" data-act="q75-qopen" data-q="${q.id}">${ic(needNote ? 'flag' : 'edit', 'sm')}${needNote ? L('Falta explicar por qué no aplica', 'Explain why it does not apply') : L('Agregar nota', 'Add a note')}</button>`}
        <button class="plink" data-act="q75-qdetail" data-q="${q.id}">${ic('camera', 'sm')}${L('Fotos y hallazgos', 'Photos & findings')}${nph + nf ? ` <b>${nph + nf}</b>` : ''}</button></div>` : ''}</article>`;
  };
  A['q75-qans'] = el => {
    const a = C.cur(); const id = el.dataset.q, v = el.dataset.v; const o = a.answers[id] || {};
    if (o.value === v) { if (v === 'No aplica' && !(o.note || '').trim()) { QE = { q: id }; SCROLL = true; R(); } return; }
    const before = C.applicable(a).length;
    a.answers[id] = { value: v, note: o.note || '', conf: v === 'Desconocido' ? 'Desconocido' : (o.conf && o.conf !== 'Desconocido' ? o.conf : 'Estimado'), ts: now(), prev: o.value || null, by: me(), source: o.source };
    C.log(a, `Respondió la pregunta ${id}: ${v}`, `Answered question ${id}: ${tx(v)}`);
    QE = v === 'No aplica' && !(o.note || '').trim() ? { q: id } : (QE && QE.q === id ? QE : null); SCROLL = !!QE; C.save(); R();
    const d = C.applicable(a).length - before;
    U.toast(d > 0 ? L(`Respuesta guardada · ${d} preguntas nuevas se activaron`, `Answer saved · ${d} new questions triggered`) : v === 'No aplica' && !(o.note || '').trim() ? L('Guardada. Falta explicar por qué no aplica.', 'Saved. Explain why it does not apply.') : L('Respuesta guardada', 'Answer saved'));
  };
  A['q75-qopen'] = el => { QE = { q: el.dataset.q }; SCROLL = true; R(); };
  A['q75-qconf'] = el => { el.parentNode.querySelectorAll('button').forEach(b => { const on = b === el; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); }); };
  A['q75-qsave'] = el => {
    const a = C.cur(); const id = el.dataset.q; const o = a.answers[id] || {}; const n = ((document.getElementById('q75-qn') || {}).value || '').trim();
